          <a href="/" class="logo-link">
            <img src="/games/reveal-board/staygo-logo.png" alt="Staygo" class="logo" />

          <nav class="nav" aria-label="เมนูหลัก">
            <a href="../../#play" class="nav-link">Play</a>
            <a href="../../#tools" class="nav-link active">Tools</a>
            <a href="../../#watch" class="nav-link">Watch & Play</a>
            <a href="../../about/" class="nav-link">About</a>
          </nav>

          <div class="header-actions">
            <a href="https://www.youtube.com/@STAYGO" target="_blank" rel="noopener noreferrer" class="icon-button" aria-label="YouTube">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
              </svg>

            <button id="menuToggle" class="icon-button" aria-label="เมนู">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu">
      <div class="mobile-menu-header">
        <span class="mobile-menu-title">เมนู</span>
        <button id="menuClose" class="icon-button" aria-label="ปิดเมนู">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <nav class="mobile-nav">
        <a href="../../#play" class="mobile-nav-link">Play</a>
        <a href="../../#tools" class="mobile-nav-link">Tools</a>
        <a href="../../#watch" class="mobile-nav-link">Watch & Play</a>
        <a href="../../about/" class="mobile-nav-link">About</a>
      </nav>
    </div>

    <main class="tl sb">
      <div class="tl-hero" id="hero">
        <h1>📊 ตารางคะแนน</h1>
        <p>จดคะแนนผู้เล่นหรือทีม กดบวกลบทีละ 1, 5 หรือ 10 คะแนนไม่หายแม้ปิดหน้าไป</p>
      </div>

      <!-- setup -->
      <section id="scrSetup" class="tl-narrow tl-stack" hidden>
        <div class="sg-panel tl-stack">
          <div>
            <span class="tl-label">เริ่มเร็ว</span>
            <div id="presets" class="sb-presets">
              <button class="sg-btn small" data-teams="2">👥 2 ทีม</button>
              <button class="sg-btn small" data-teams="3">👥 3 ทีม</button>
              <button class="sg-btn small" data-teams="4">👥 4 ทีม</button>
            </div>
          </div>
          <div>
            <span class="tl-label">ผู้เล่น / ทีม</span>
            <div id="rows" class="sb-rows"></div>
            <button id="addRow" class="sg-btn small block sb-add">＋ เพิ่มผู้เล่น</button>
            <p class="tl-hint">แตะวงกลมเพื่อเปลี่ยนสี · กด Enter เพื่อเพิ่มคนถัดไป</p>
          </div>
          <button id="startBtn" class="sg-btn blue block sb-start">▶ เริ่มนับคะแนน</button>
          <button id="cancelEdit" class="sg-btn small block" hidden>ยกเลิก</button>
        </div>
      </section>

      <!-- play -->
      <section id="scrPlay" class="tl-stack" hidden>
        <div class="sb-toolbar">
          <div class="sb-steplabel">ทีละ</div>
          <div id="steps" class="sb-steps" role="group" aria-label="บวกลบทีละ"></div>
          <button id="undoBtn" class="sg-btn small sb-undo" disabled>↶ ย้อนกลับ</button>
        </div>
        <div id="cards" class="sb-cards"></div>
        <div class="sb-actions tl-nobig">
          <button id="summaryBtn" class="sg-btn yellow">🏆 สรุปคะแนน</button>
          <button id="bigBtn" class="sg-btn">📺 จอใหญ่</button>
          <button id="editBtn" class="sg-btn">✏️ แก้ไขผู้เล่น</button>
          <button id="zeroBtn" class="sg-btn">🔄 ล้างคะแนน</button>
          <button id="newBtn" class="sg-btn">🆕 เกมใหม่</button>
        </div>
      </section>

      <!-- summary -->
      <div id="summary" class="sb-overlay" hidden>
        <div class="sg-panel sb-summary" role="dialog" aria-modal="true" aria-labelledby="sumTitle">
          <h2 id="sumTitle">🏆 สรุปคะแนน</h2>
          <ol id="ranking" class="sb-ranking"></ol>
          <button id="closeSummary" class="sg-btn blue block">ปิด</button>
        </div>
      </div>
    </main>

    <button id="exitBig" class="sg-btn small sb-exitbig" hidden>ออกจากจอใหญ่</button>
    <script src="./app.js"></script>
  </body>
</html>
