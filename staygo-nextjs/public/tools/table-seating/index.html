  <body class="sg-page sg-skin">
    <header class="header">
      <div class="container">
        <div class="header-content">
          <a href="/" class="logo-link">
            <img src="/games/reveal-board/staygo-logo.png" alt="Staygo" class="logo" />
          </a>

          <nav class="nav" aria-label="เมนูหลัก">
            <a href="/#play" class="nav-link">Play</a>
            <a href="/tools/" class="nav-link active">Tools</a>
            <a href="/watch/" class="nav-link">Watch & Play</a>
            <a href="/about/" class="nav-link">About</a>
          </nav>

          <div class="header-actions">
            <a href="https://www.youtube.com/@STAYGO" target="_blank" rel="noopener noreferrer" class="icon-button" aria-label="YouTube">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>

              </svg>
            </a>
            <button id="menuToggle" class="icon-button" aria-label="เมนู">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu">
      <div class="mobile-menu-header">
        <span class="mobile-menu-title">เมนู</span>
        <button id="menuClose" class="icon-button" aria-label="ปิดเมนู">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <nav class="mobile-nav">
        <a href="/#play" class="mobile-nav-link">Play</a>
        <a href="/tools/" class="mobile-nav-link">Tools</a>
        <a href="/watch/" class="mobile-nav-link">Watch & Play</a>
        <a href="/about/" class="mobile-nav-link">About</a>
      </nav>
    </div>

    <main class="tl">
      <div class="tl-hero">
        <h1>🪑 จัดโต๊ะสลับคน</h1>
        <p>ใส่รายชื่อ เลือกขนาดโต๊ะกับจำนวนรอบ แล้วจัดให้แต่ละรอบได้เจอคนใหม่ซ้ำน้อยที่สุด เหมาะกับงานบอร์ดเกมหรือกิจกรรมคนเยอะ</p>
      </div>

      <section class="tl-stack">
        <div class="sg-panel tl-stack tl-narrow ts-form">
          <label><span class="tl-label">รายชื่อ (บรรทัดละคน)</span><textarea id="names" class="sg-input" placeholder="มายด์&#10;จูน&#10;นน&#10;…"></textarea></label>
          <p id="count" class="tl-hint" style="margin-top:-8px"></p>
          <div class="ts-grid">
            <label><span class="tl-label">คนต่อโต๊ะ</span><select id="size" class="sg-input"></select></label>
            <label><span class="tl-label">จำนวนรอบ</span><select id="rounds" class="sg-input"></select></label>
          </div>
          <p id="preview" class="tl-hint" style="margin:0"></p>
          <div class="tl-row">
            <button id="make" class="sg-btn blue">🎲 จัดโต๊ะ</button>
            <button id="sample" class="sg-btn small">ใส่ชื่อตัวอย่าง</button>
          </div>
        </div>

        <div id="result" class="tl-stack" hidden>
          <div class="sg-panel ts-summary">
            <div id="stats"></div>
            <div class="tl-row tl-nobig">
              <button id="copy" class="sg-btn small">📋 คัดลอกเป็นข้อความ</button>
              <button id="print" class="sg-btn small">🖨️ พิมพ์</button>
              <button id="reroll" class="sg-btn small">🔄 จัดใหม่</button>
            </div>
          </div>
          <div id="rounds-out" class="tl-stack"></div>
        </div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>

  </body>
