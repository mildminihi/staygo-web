name: Build and deploy to Plesk

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only list what would be uploaded (no changes on the server)"
        type: boolean
        default: false
  # Rebuild every day at 18:00 Thailand time so the latest YouTube clips show up
  # without a code change (scripts/fetch-youtube.mjs runs before the build).
  schedule:
    - cron: '0 11 * * *'

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./staygo-nextjs

    steps:
      - name: Check FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        working-directory: .
        run: |
          missing=""
          [ -z "$FTP_SERVER" ] && missing="$missing FTP_SERVER"
          [ -z "$FTP_USERNAME" ] && missing="$missing FTP_USERNAME"
          [ -z "$FTP_PASSWORD" ] && missing="$missing FTP_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets:$missing (Settings → Secrets and variables → Actions)"
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './staygo-nextjs/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build with Next.js
        run: npm run build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}

      # lftp instead of a Node FTP action: the server runs ProFTPD, which requires the
      # FTPS data connection to reuse the TLS session (Node FTP clients get ECONNRESET).
      # Uploads new and changed files; never deletes anything on the server.
      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp
        working-directory: .

      - name: Upload to Plesk
        working-directory: .
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          LFTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PROTOCOL: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          FTP_PORT: ${{ vars.FTP_PORT || 21 }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || 'httpdocs/' }}
          # "loose" skips the TLS certificate check; set the FTP_SECURITY variable only if needed.
          FTP_SECURITY: ${{ vars.FTP_SECURITY || 'strict' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: |
          if [ "$FTP_PROTOCOL" = "ftp" ]; then TLS="set ftp:ssl-allow false"; else TLS="set ftp:ssl-force true; set ftp:ssl-protect-data true"; fi
          if [ "$FTP_SECURITY" = "loose" ]; then VERIFY=false; else VERIFY=true; fi
          lftp -c "
            set net:max-retries 3; set net:timeout 30; set net:reconnect-interval-base 5
            $TLS
            set ssl:verify-certificate $VERIFY
            open --env-password -u \"$FTP_USERNAME\" -p $FTP_PORT $FTP_SERVER
            echo '--- server folder before upload:'; cls -1 \"$FTP_SERVER_DIR\"; echo '---'
            mirror --reverse --only-newer --no-perms --parallel=4 --verbose=1 $DRY_RUN ./staygo-nextjs/out/ \"$FTP_SERVER_DIR\"
          "
