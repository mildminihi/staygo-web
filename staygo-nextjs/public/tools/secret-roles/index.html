    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Kanit:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="stylesheet" href="/assets/css/staygo-cards.css" />
    <link rel="stylesheet" href="/assets/css/staygo-skin.css" />
    <link rel="stylesheet" href="/assets/css/staygo-tools.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="/assets/js/config.js"></script>
    <script defer src="/assets/js/site.js"></script>
    <script src="/assets/js/analytics.js" defer></script>
  </head>
  <body class="sg-page sg-skin">
    <header class="header">
      <div class="container">
        <div class="header-content">
          <a href="/" class="logo-link">
            <img src="/games/reveal-board/staygo-logo.png" alt="Staygo" class="logo" />
          </a>

          <nav class="nav" aria-label="เมนูหลัก">
            <a href="/#play" class="nav-link">Play</a>
            <a href="/tools/" class="nav-link active">Tools</a>
            <a href="/watch/" class="nav-link">Watch & Play</a>
            <a href="/about/" class="nav-link">About</a>
          </nav>

          <div class="header-actions">
            <a href="https://www.youtube.com/@STAYGO" target="_blank" rel="noopener noreferrer" class="icon-button" aria-label="YouTube">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
              </svg>
            </a>
            <button id="menuToggle" class="icon-button" aria-label="เมนู">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu">
      <div class="mobile-menu-header">
        <span class="mobile-menu-title">เมนู</span>
        <button id="menuClose" class="icon-button" aria-label="ปิดเมนู">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <nav class="mobile-nav">
        <a href="/#play" class="mobile-nav-link">Play</a>
        <a href="/tools/" class="mobile-nav-link">Tools</a>
        <a href="/watch/" class="mobile-nav-link">Watch & Play</a>
        <a href="/about/" class="mobile-nav-link">About</a>
      </nav>
    </div>

    <main class="tl">
      <div class="tl-hero">
        <h1>🎭 แจกบทลับ</h1>
        <p>ส่งมือถือเครื่องเดียววนกัน แต่ละคนแตะดูบทของตัวเอง ไม่ต้องใช้การ์ด ไม่ต้องมีคนคุมบทแยก</p>
      </div>

      <!-- setup -->
      <section id="setup" class="tl-narrow tl-stack" hidden>
        <div class="sg-panel tl-stack">
          <div>
            <span class="tl-label">เกม</span>
            <div class="tl-choice" id="games">
              <button data-game="werewolf" class="active"><b>🐺 หมาป่า (Werewolf)</b><small>ชาวบ้านต้องหาหมาป่าให้เจอก่อนโดนกินหมด · 5–20 คน</small></button>
              <button data-game="spyfall"><b>🕵️ สายลับ (Spyfall)</b><small>ทุกคนรู้สถานที่ ยกเว้นสายลับ · 4–12 คน</small></button>
              <button data-game="undercover"><b>🤫 ใครคือสปาย (Undercover)</b><small>ได้คำคล้ายกันแต่ไม่เหมือน · 4–15 คน</small></button>
            </div>
          </div>
          <label><span class="tl-label">ชื่อผู้เล่น (บรรทัดละคน)</span><textarea id="names" class="sg-input" placeholder="มายด์&#10;จูน&#10;นน&#10;หยก&#10;ต้น"></textarea></label>
          <p id="nameCount" class="tl-hint" style="margin-top:-8px"></p>
          <div id="opts" class="tl-stack"></div>
          <button id="deal" class="sg-btn blue block">แจกบท</button>
        </div>
      </section>

      <!-- deal: pass the phone -->
      <section id="dealing" class="tl-narrow" hidden>
        <div class="sg-panel rl-deal">
          <p class="tl-hint" style="margin:0">คนที่ <b id="dealNo" class="tl-num"></b> / <b id="dealTotal" class="tl-num"></b></p>
          <h2 class="rl-to">ส่งเครื่องให้ <span id="dealName"></span></h2>
          <button id="card" class="rl-card" aria-live="polite"></button>
          <button id="passOn" class="sg-btn blue block" disabled>ดูแล้ว ส่งต่อ ▶</button>
          <p class="tl-hint">แตะการ์ดเพื่อเปิดดู แตะอีกทีเพื่อปิด ก่อนส่งให้คนถัดไป</p>
        </div>
      </section>

      <!-- play -->
      <section id="play" class="tl-narrow tl-stack" hidden>
        <div id="playBody" class="tl-stack"></div>
        <div class="tl-row">
          <button id="reveal" class="sg-btn yellow">👀 เฉลยทั้งหมด</button>
          <button id="again" class="sg-btn blue">🔄 แจกใหม่ (คนเดิม)</button>
          <button id="back" class="sg-btn">⚙️ ตั้งค่า</button>
        </div>
        <div id="revealBox" class="sg-panel" hidden></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>

  </body>
</html>
