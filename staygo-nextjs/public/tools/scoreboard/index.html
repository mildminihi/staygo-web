          <nav class="nav" aria-label="เมนูหลัก">

            <a href="../../#watch" class="nav-link">Watch & Play</a>
            <a href="../../about/" class="nav-link">About</a>
          </nav>

          <div class="header-actions">
            <a href="https://www.youtube.com/@STAYGO" target="_blank" rel="noopener noreferrer" class="icon-button" aria-label="YouTube">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>

              </svg>

            <button id="menuToggle" class="icon-button" aria-label="เมนู">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>

        </div>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu">
      <div class="mobile-menu-header">
        <span class="mobile-menu-title">เมนู</span>
        <button id="menuClose" class="icon-button" aria-label="ปิดเมนู">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">

            <line x1="6" y1="6" x2="18" y2="18"></line>

      </div>
      <nav class="mobile-nav">
        <a href="../../#play" class="mobile-nav-link">Play</a>
        <a href="../../#tools" class="mobile-nav-link">Tools</a>
        <a href="../../#watch" class="mobile-nav-link">Watch & Play</a>
        <a href="../../about/" class="mobile-nav-link">About</a>
      </nav>
    </div>

    <main>
      <section class="section">
        <div class="container">
          <div class="team-header">
            <h1 class="section-title">📊 ตารางคะแนน</h1>
            <p class="team-description">สร้างบอร์ดคะแนนสำหรับนับคะแนนผู้เล่นหรือทีม</p>
          </div>

          <!-- Setup Form -->
          <div id="setupForm" class="scoreboard-setup">
            <div class="setup-card">
              <div class="setup-icon">📝</div>
              <h3 class="setup-title">สร้างบอร์ดคะแนน</h3>
              <p class="setup-subtitle">ใส่ชื่อผู้เล่นหรือทีม (แต่ละบรรทัด)</p>
              
              <div class="form-group">
                <textarea 
                  id="playersInput" 
                  class="team-input scoreboard-input" 
                  placeholder="👥 ทีมแดง&#10;👥 ทีมเขียว&#10;👥 ทีมเหลือง&#10;👥 ทีมเข้า"
                  rows="8"
                ></textarea>
                <div class="input-hint">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="16" x2="12" y2="12"></line>
                    <line x1="12" y1="8" x2="12.01" y2="8"></line>
                  </svg>
                  <span>ต้องมีอย่างน้อย 2 คนขึ้นไป</span>
                </div>
              </div>
              
              <button class="button button-primary button-lg" onclick="createScoreboard()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right: 8px;">
                  <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                  <polyline points="14 2 14 8 20 8"></polyline>
                  <line x1="12" y1="18" x2="12" y2="12"></line>
                  <line x1="9" y1="15" x2="15" y2="15"></line>
                </svg>
                สร้างบอร์ด
              </button>
            </div>
          </div>

          <!-- Scoreboard -->
          <div id="scoreboardContainer" style="display: none;">
            <div class="scoreboard-actions">
              <button class="button button-secondary button-md" onclick="showSummary()">🏆 สรุปคะแนน</button>
              <button class="button button-outline button-md" onclick="resetScoreboard()">🔄 เริ่มใหม่</button>
            </div>

            <div id="scoreboardList" class="scoreboard-list"></div>
          </div>
        </div>
      </section>
    </main>

    <!-- Summary Modal -->
    <div class="modal-overlay" id="summaryModal">
      <div class="modal-content summary-modal">
        <h2 class="modal-title">🏆 สรุปผลคะแนน</h2>
        <div id="rankingList" class="ranking-list"></div>
        <button class="modal-btn" onclick="closeSummary()">ปิด</button>
      </div>
    </div>

    <script>
      let players = [];

      // Check if coming from team randomizer
      document.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('fromTeams') === 'true') {
          loadTeamsFromStorage();
        }
      });

      function loadTeamsFromStorage() {
        const teamData = localStorage.getItem('scoreboardTeams');
        if (teamData) {
          const teams = JSON.parse(teamData);
          players = teams.map((team, index) => ({
            id: index,
            name: team.name,
            members: team.members,
            color: team.color,
            score: 0
          }));
          
          renderScoreboard();
          document.getElementById('setupForm').style.display = 'none';
          document.getElementById('scoreboardContainer').style.display = 'block';
          localStorage.removeItem('scoreboardTeams'); // Clean up
        }
      }

      function createScoreboard() {
        const input = document.getElementById('playersInput').value.trim();
        if (!input) {
          alert('กรุณาใส่ชื่อผู้เล่นอย่างน้อย 1 คน');
          return;
        }

        const names = input.split('\n').map(n => n.trim()).filter(n => n);
        if (names.length < 2) {
          alert('กรุณาใส่ชื่อผู้เล่นอย่างน้อย 2 คน');
          return;
        }

        players = names.map((name, index) => ({
          id: index,
          name: name,
          score: 0
        }));

        renderScoreboard();
        document.getElementById('setupForm').style.display = 'none';
        document.getElementById('scoreboardContainer').style.display = 'block';
      }

      function renderScoreboard() {
        const container = document.getElementById('scoreboardList');
        container.innerHTML = players.map(player => `
          <div class="score-card">
            <div class="score-card-header" ${player.color ? `style="background-color: ${player.color};"` : ''}>
              <h3 class="score-card-name">${player.name}</h3>
            </div>
            <div class="score-card-body">
              ${player.members ? `
                <div class="team-members-list">
                  ${player.members.map(member => `<div class="team-member-badge">${member}</div>`).join('')}
                </div>
              ` : ''}
              <div class="score-display">
                <span class="score-value">${player.score}</span>
              </div>
              <div class="score-controls">
                <button class="score-btn minus-btn" onclick="updateScore(${player.id}, -1)">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
                <button class="score-btn plus-btn" onclick="updateScore(${player.id}, 1)">
                  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                  </svg>
                </button>
              </div>
            </div>
          </div>
        `).join('');
      }

      function updateScore(playerId, delta) {
        const player = players.find(p => p.id === playerId);
        if (player) {
          player.score = Math.max(0, player.score + delta);
          renderScoreboard();
        }
      }

      function showSummary() {
        const sorted = [...players].sort((a, b) => b.score - a.score);
        const rankingContainer = document.getElementById('rankingList');
        
        rankingContainer.innerHTML = sorted.map((player, index) => {
          let medal = '';
          let rankClass = '';
          if (index === 0) {
            medal = '🥇';
            rankClass = 'rank-1';
          } else if (index === 1) {
            medal = '🥈';
            rankClass = 'rank-2';
          } else if (index === 2) {
            medal = '🥉';
            rankClass = 'rank-3';
          }

          return `
            <div class="ranking-item ${rankClass}">
              <div class="ranking-medal">${medal || `#${index + 1}`}</div>
              <div class="ranking-info">
                <div class="ranking-name">${player.name}</div>
                <div class="ranking-score">${player.score} คะแนน</div>
              </div>
            </div>
          `;
        }).join('');

        document.getElementById('summaryModal').classList.add('active');
      }

      function closeSummary() {
        document.getElementById('summaryModal').classList.remove('active');
      }

      function resetScoreboard() {
        if (confirm('ต้องการเริ่มใหม่หรือไม่?')) {
          players = [];
          document.getElementById('playersInput').value = '';
          document.getElementById('setupForm').style.display = 'block';
          document.getElementById('scoreboardContainer').style.display = 'none';
        }
      }
    </script>
  </body>
</html>
