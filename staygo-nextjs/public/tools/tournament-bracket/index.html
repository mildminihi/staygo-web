<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <meta name="title" content="จัดสายการแข่งขัน - แพ้คัดออก แพ้ 2 ครั้ง พบกันหมด | STAYGO" />
    <meta name="description" content="จัดสายการแข่งขันออนไลน์ฟรี แบบแพ้คัดออก แพ้ 2 ครั้งตกรอบ (Double Elimination) และพบกันหมด (Round Robin) แตะเพื่อใส่ผล เลื่อนผู้ชนะอัตโนมัติ มีตารางคะแนนและโหมดจอใหญ่" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://staygoch.com/tools/tournament-bracket/" />
    <meta property="og:title" content="จัดสายการแข่งขัน - แพ้คัดออก แพ้ 2 ครั้ง พบกันหมด" />
    <meta property="og:description" content="จัดสายการแข่งขันออนไลน์ฟรี แบบแพ้คัดออก แพ้ 2 ครั้งตกรอบ (Double Elimination) และพบกันหมด (Round Robin) แตะเพื่อใส่ผล เลื่อนผู้ชนะอัตโนมัติ มีตารางคะแนนและโหมดจอใหญ่" />
    <meta property="og:image" content="https://staygoch.com/games/reveal-board/staygo-logo.png" />
    <link rel="canonical" href="https://staygoch.com/tools/tournament-bracket/" />
    <link rel="icon" type="image/png" href="/games/reveal-board/staygo-logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Mitr:wght@400;500;600&family=Inter:wght@400;500;600;700&family=Kanit:wght@700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/css/site.css" />
    <link rel="stylesheet" href="/assets/css/staygo-cards.css" />
    <link rel="stylesheet" href="/assets/css/staygo-skin.css" />
    <link rel="stylesheet" href="/assets/css/staygo-tools.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="/assets/js/config.js"></script>
    <script defer src="/assets/js/site.js"></script>
    <script src="/assets/js/analytics.js" defer></script>
  </head>
  <body class="sg-page sg-skin">
    <header class="header">
      <div class="container">
        <div class="header-content">
          <a href="/" class="logo-link">
            <img src="/games/reveal-board/staygo-logo.png" alt="Staygo" class="logo" />
          </a>

          <nav class="nav" aria-label="เมนูหลัก">
            <a href="/#play" class="nav-link">Play</a>
            <a href="/tools/" class="nav-link active">Tools</a>
            <a href="/watch/" class="nav-link">Watch & Play</a>
            <a href="/about/" class="nav-link">About</a>
          </nav>

          <div class="header-actions">
            <a href="https://www.youtube.com/@STAYGO" target="_blank" rel="noopener noreferrer" class="icon-button" aria-label="YouTube">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M22.54 6.42a2.78 2.78 0 0 0-1.94-2C18.88 4 12 4 12 4s-6.88 0-8.6.46a2.78 2.78 0 0 0-1.94 2A29 29 0 0 0 1 11.75a29 29 0 0 0 .46 5.33A2.78 2.78 0 0 0 3.4 19c1.72.46 8.6.46 8.6.46s6.88 0 8.6-.46a2.78 2.78 0 0 0 1.94-2 29 29 0 0 0 .46-5.25 29 29 0 0 0-.46-5.33z"></path>
                <polygon points="9.75 15.02 15.5 11.75 9.75 8.48 9.75 15.02"></polygon>
              </svg>
            </a>
            <button id="menuToggle" class="icon-button" aria-label="เมนู">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <line x1="3" y1="12" x2="21" y2="12"></line>
                <line x1="3" y1="6" x2="21" y2="6"></line>
                <line x1="3" y1="18" x2="21" y2="18"></line>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </header>

    <!-- Mobile Menu -->
    <div id="mobileMenu" class="mobile-menu">
      <div class="mobile-menu-header">
        <span class="mobile-menu-title">เมนู</span>
        <button id="menuClose" class="icon-button" aria-label="ปิดเมนู">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <nav class="mobile-nav">
        <a href="/#play" class="mobile-nav-link">Play</a>
        <a href="/tools/" class="mobile-nav-link">Tools</a>
        <a href="/watch/" class="mobile-nav-link">Watch & Play</a>
        <a href="/about/" class="mobile-nav-link">About</a>
      </nav>
    </div>

    <main class="tl tb">
      <div class="tl-hero">
        <h1>🏆 จัดสายการแข่งขัน</h1>
        <p>ใส่รายชื่อ เลือกรูปแบบ แล้วแตะคู่ที่แข่งเพื่อใส่ผล ระบบเลื่อนผู้ชนะให้เอง บันทึกอัตโนมัติ ปิดหน้าแล้วกลับมาต่อได้</p>
      </div>

      <!-- setup -->
      <section id="setup" class="tl-stack tb-setup" hidden>
        <div class="sg-panel tl-stack">
          <label><span class="tl-label">ชื่อทัวร์นาเมนต์ <small class="tl-hint">(ไม่ใส่ก็ได้)</small></span>
            <input id="titleInput" class="sg-input" maxlength="60" placeholder="เช่น STAYGO Cup ครั้งที่ 1" /></label>
          <div>
            <span class="tl-label">ผู้เข้าแข่งขัน (บรรทัดละคน/ทีม)</span>
            <textarea id="namesInput" class="sg-input" placeholder="มายด์&#10;จูน&#10;นน&#10;หยก"></textarea>
            <div class="tl-row tb-namebar">
              <span id="nameCount" class="tl-hint" style="margin:0"></span>
              <button id="sampleBtn" class="sg-btn small">ใส่ชื่อตัวอย่าง</button>
            </div>
          </div>
          <div>
            <span class="tl-label">รูปแบบ</span>
            <div id="modes" class="tl-choice">
              <button data-mode="single"><b>🥊 แพ้คัดออก</b><small>แพ้ครั้งเดียวตกรอบ จบไวที่สุด</small></button>
              <button data-mode="double"><b>🔁 แพ้ 2 ครั้งตกรอบ</b><small>แพ้ครั้งแรกยังมีสายล่างให้แก้มือ</small></button>
              <button data-mode="roundrobin"><b>🔄 พบกันหมด</b><small>ทุกคนเจอกันครบ นับแต้มจัดอันดับ</small></button>
            </div>
          </div>
          <div id="modeOpts" class="tb-opts"></div>
          <label class="tb-check"><input type="checkbox" id="shuffleChk" checked /> สุ่มสาย (ไม่ติ๊ก = คนบนสุดเป็นมือ 1 ได้บายก่อน)</label>
          <p id="preview" class="tb-preview"></p>
          <button id="startBtn" class="sg-btn blue block">🏆 เริ่มทัวร์นาเมนต์</button>
        </div>
      </section>

      <!-- tournament -->
      <section id="board" hidden>
        <div class="tb-head">
          <div>
            <h2 id="tTitle" class="tb-title"></h2>
            <p id="tMeta" class="tl-hint" style="margin:0"></p>
          </div>
          <div class="tb-prog">
            <span>เล่นแล้ว <b id="progText" class="tl-num"></b></span>
            <div class="tb-track"><div id="progFill" class="tb-fill"></div></div>
          </div>
        </div>

        <div class="tl-row tb-tools tl-nobig">
          <label class="tb-check"><input type="checkbox" id="scoreChk" /> ใส่สกอร์</label>
          <button id="undoBtn" class="sg-btn small" disabled>↩️ ย้อนกลับ</button>
          <button id="copyBtn" class="sg-btn small">📋 คัดลอกผล</button>
          <button id="bigBtn" class="sg-btn small">📺 จอใหญ่</button>
          <button id="editBtn" class="sg-btn small">⚙️ ตั้งค่าใหม่</button>
        </div>

        <div id="champ" class="tb-champ" hidden></div>
        <div id="nextCard" class="tb-next tl-nobig" hidden></div>
        <div id="content" class="tl-stack"></div>
        <button id="exitBig" class="sg-btn small tb-exitbig" hidden>ออกจากจอใหญ่</button>
      </section>

      <!-- match sheet -->
      <div id="sheet" class="tb-sheet" hidden>
        <div class="tb-sheet-bg" data-close></div>
        <div class="tb-sheet-card sg-panel" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
          <p id="sheetLabel" class="tl-hint" style="margin:0"></p>
          <h3 id="sheetTitle" class="tb-sheet-title">ใครชนะ?</h3>
          <div id="sheetBody" class="tb-sheet-body"></div>
          <p id="sheetMsg" class="tb-sheet-msg"></p>
          <div class="tl-row">
            <button id="sheetSave" class="sg-btn blue" hidden>บันทึกสกอร์</button>
            <button id="sheetDraw" class="sg-btn" hidden>🤝 เสมอ</button>
            <button id="sheetClear" class="sg-btn" hidden>ล้างผล</button>
            <button class="sg-btn" data-close>ยกเลิก</button>
          </div>
        </div>
      </div>
    </main>

    <script type="module" src="./app.js"></script>

  </body>
</html>
